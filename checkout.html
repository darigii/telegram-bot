
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    <div class="header">
        <h2>Оформление заказа</h2>
    </div>
    
    <div class="checkout-container">
        <h3>Ваш заказ</h3>
        <div class="order-items">
            <div class="order-item">
                <img src="ph/rm2.jpeg" alt="Рамен2">
                <p>Hot chicken карбонара</p>
                <p>350 ₽</p>
            </div>
            <div class="order-item">
                <img src="ph/ph2.jpeg" alt="Кушон">
                <p>Кушон для лица</p>
                <p>1500 ₽</p>
            </div>
            <div class="order-item">
                <img src="ph/al.jpeg" alt="Альбом Blackpink">
                <p>Blackpink Born Pink</p>
                <p>3200 ₽</p>
            </div>
            <div class="order-item">
                <img src="ph/s1.jpeg" alt="Соус1">
                <p>Соус со вкусом острой курицы</p>
                <p>600 ₽</p>
            </div>
            <div class="order-item">
                <img src="ph/cl2.jpeg" alt="Одежда">
                <p>MINISO, Футболка</p>
                <p>1500 ₽</p>
            </div>
        </div>
        
        <div class="total">
            <p>Итого: <span id="total-price">7150</span> ₽</p>
        </div>

        <h3>Способ оплаты</h3>
        <select id="payment-method">
            <option>Картой онлайн</option>
            <option>Наличными при получении</option>
        </select>

        <h3>Информация о доставке</h3>
        <input type="text" id="name" placeholder="Имя">
        <input type="tel" id="phone" placeholder="Номер телефона">
        <textarea id="address" placeholder="Адрес доставки"></textarea>

        <button class="order-btn" id="place-order">Оформить заказ</button>
    </div>
</body>
</html>
