<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <link rel="stylesheet" href="basket.css">
</head>
<body>
    <div class="header">
        <h2>Корзина</h2>
    </div>
    <div class="cart-container">
        <div class="cart-items" id="cart-items">
            <div class="cart-item">
                <img src="ph/rm2.jpeg" alt="Рамен2">
                <p>Hot chicken карбонара</p>
                <p>350 ₽</p>
            </div>
            <div class="cart-item">
                <img src="ph/ph2.jpeg" alt="Кушон">
                <p>Кушон для лица</p>
                <p>1500 ₽</p>
            </div>
            <div class="cart-item">
                <img src="ph/al.jpeg" alt="Альбом Blackpink">
                <p>Blackpink Born Pink</p>
                <p>3200 ₽</p>
            </div>
            <div class="cart-item">
                <img src="ph/s1.jpeg" alt="Соус1">
                <p>Соус со вкусом острой курицы</p>
                <p>600 ₽</p>
            </div>
            <div class="cart-item">
                <img src="ph/cl2.jpeg" alt="Одежда">
                <p>MINISO, Футболка</p>
                <p>1500 ₽</p>
            </div>
        </div>
        <div class="cart-summary">
            <p>Итого: <span id="total-price">7150</span> ₽</p>
            <button class="checkout-btn" id="checkout">Оформить заказ</button>
        </div>
    </div>
</body>
</html>
